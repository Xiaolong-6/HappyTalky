name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache CI debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: happytalky-android-debug-keystore-v1

      - name: Ensure Android debug keystore
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt               -keystore ~/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Android Debug,O=Android,C=US"               -keyalg RSA               -keysize 2048               -validity 10000
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Install Android 37 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Test release cleanup policy
        run: node --test .github/scripts/cleanup-debug-releases.test.cjs

      - name: Test and build
        shell: bash
        run: gradle --no-daemon :core:testDebugUnitTest :wear:testDebugUnitTest :mobile:assembleDebug :wear:assembleDebug

      - name: Build Play release bundles (CI signing smoke test)
        shell: bash
        run: |
          export HAPPYTALKY_RELEASE_STORE_FILE="$HOME/.android/debug.keystore"
          export HAPPYTALKY_RELEASE_STORE_PASSWORD="android"
          export HAPPYTALKY_RELEASE_KEY_ALIAS="androiddebugkey"
          export HAPPYTALKY_RELEASE_KEY_PASSWORD="android"
          gradle --no-daemon :mobile:bundleRelease :wear:bundleRelease

      - name: Render UI screenshot baselines
        shell: bash
        run: gradle --no-daemon :mobile:updateDebugScreenshotTest :wear:updateDebugScreenshotTest

      - name: Upload phone UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: HappyTalky-phone-ui-screenshots
          path: mobile/src/screenshotTestDebug/reference
          if-no-files-found: error

      - name: Upload watch UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: HappyTalky-watch-ui-screenshots
          path: wear/src/screenshotTestDebug/reference
          if-no-files-found: error

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: HappyTalky-mobile-debug
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: error

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: HappyTalky-wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: debug-dist-lifecycle
      cancel-in-progress: false
    steps:
      - name: Check whether this build is still current
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            let eligible = true;
            if (context.eventName === 'pull_request') {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
              eligible = pr.state === 'open' && pr.head.sha === context.payload.pull_request.head.sha;
            } else {
              const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
              eligible = ref.object.sha === context.sha;
            }
            const tag = context.eventName === 'pull_request' ? `debug-pr-${context.issue.number}` : 'debug-main';
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (!release.prerelease || release.draft || release.author?.login !== 'github-actions[bot]') {
                core.warning(`Reserved tag ${tag} has a protected release; skipping publication.`);
                eligible = false;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('eligible', String(eligible));

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.eligible == 'true'
        with:
          name: HappyTalky-mobile-debug
          path: phone
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.eligible == 'true'
        with:
          name: HappyTalky-wear-debug
          path: watch

      - name: Publish rolling debug APKs
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="debug-main"
          if [ -n "$PR_NUMBER" ]; then TAG="debug-pr-$PR_NUMBER"; fi
          # Real filenames ensure the asset URL matches the documented APK name.
          mv phone/mobile-debug.apk HappyTalky-phone-debug.apk
          mv watch/wear-debug.apk HappyTalky-watch-debug.apk
          jq -n --arg tag "$TAG" --arg commit "$BUILD_SHA" --arg builtAt "$(date -u +%FT%TZ)" \
            '{tag:$tag, commit:$commit, phone:"HappyTalky-phone-debug.apk", watch:"HappyTalky-watch-debug.apk", builtAt:$builtAt}' > debug-dist.json
          # These reserved rolling tags must point to the actual built commit.
          gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" > tag-refs.json
          if jq -e --arg ref "refs/tags/$TAG" 'any(.[]; .ref == $ref)' tag-refs.json >/dev/null; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$BUILD_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$BUILD_SHA"
          fi
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --slurp > releases.json
          if ! jq -e --arg tag "$TAG" 'any(.[][]; .tag_name == $tag)' releases.json >/dev/null; then
            gh release create "$TAG" --verify-tag --prerelease --title "HappyTalky $TAG" \
              --notes "Rolling debug build. PR builds are removed after merging into main; use debug-main after merge."
          fi
          gh release upload "$TAG" HappyTalky-phone-debug.apk HappyTalky-watch-debug.apk debug-dist.json --clobber
          # Remove only the two old CI asset names, after both replacement APKs upload.
          # Older workflows set labels but left these actual filenames unchanged.
          jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .assets[] | select(.name == "mobile-debug.apk" or .name == "wear-debug.apk") | .id' releases.json |
            while read -r asset_id; do
              gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
            done
